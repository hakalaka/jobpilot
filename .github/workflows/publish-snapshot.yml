name: publish-snapshot
# 09:00 IST: export the PUBLIC market view (aggregates + public postings only) and publish to GitHub Pages.
# Skips publishing if the latest quality gate has a failed blocking check, so a bad day never goes public.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install databricks-sdk
      - name: Export snapshot data
        id: export
        run: python tools/export_snapshot.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
