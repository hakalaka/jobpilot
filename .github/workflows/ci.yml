name: ci
# Every push: unit tests + bundle validation. Push to main: deploy to the workspace.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      overwrite_remote_changes:
        # The repo is the source of truth for the dashboard. If someone edits it in the UI, the next
        # deploy stops with "modified remotely" so the change isn't lost by accident. Tick this to
        # deliberately throw those UI edits away and deploy the code version (bundle deploy --force).
        description: "Overwrite dashboard edits made in the UI (deploy --force)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src pytest -q
      - run: python tools/demo_offline.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate -t prod
      - name: Deploy bundle
        if: github.ref == 'refs/heads/main'
        # --force only when someone chose it on a manual run; normal pushes keep the safety check.
        run: databricks bundle deploy -t prod ${{ inputs.overwrite_remote_changes && '--force' || '' }}
