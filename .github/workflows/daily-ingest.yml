name: daily-ingest
# 07:00 IST daily: snapshot every verified career board, land it in the Unity Catalog volume,
# and start the Databricks job. GitHub's runners have open internet; Free Edition serverless doesn't.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

concurrency: {group: daily-ingest, cancel-in-progress: false}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      LANDING: dbfs:/Volumes/workspace/jobpilot/raw/inbox/ats/
      RUNS: dbfs:/Volumes/workspace/jobpilot/raw/runs/
      STATE: dbfs:/Volumes/workspace/jobpilot/raw/state/known_postings.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml
      - uses: databricks/setup-cli@main
      - name: Download known postings (incremental state)
        # Exported by the Databricks job (task export_fetch_state). Missing on the first run: then every
        # job is fetched in full, which is also the safe fallback if the download fails.
        run: |
          mkdir -p state
          databricks fs cp "$STATE" state/known_postings.json 2> err.txt \
            && echo "State: $(jq '.postings | length' state/known_postings.json) known postings" >> "$GITHUB_STEP_SUMMARY" \
            || echo "No state file yet: full fetch" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch today's postings
        run: python tools/fetch_jobs.py --state state/known_postings.json | tee out_log.txt
      - run: tail -n 1 out_log.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Land file in the volume
        run: |
          f=$(ls out/ats_*.jsonl)
          if [ ! -s "$f" ]; then echo "empty snapshot, nothing to land"; exit 0; fi
          databricks fs mkdir "$LANDING" 2> err.txt || true
          if ! databricks fs cp "$f" "$LANDING$(basename "$f")" 2>> err.txt; then
            echo "::error title=Landing failed::$(tr '\n' ' ' < err.txt)"; exit 1
          fi
          echo "Landed $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          # The per-board run log goes to its own folder (it has a different shape from postings)
          r=$(ls out/runs_*.jsonl)
          databricks fs mkdir "$RUNS" 2>/dev/null || true
          databricks fs cp "$r" "$RUNS$(basename "$r")" && echo "Landed $(basename "$r")" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the pipeline job
        run: |
          id=$(databricks jobs list --name "jobpilot-daily" --output json | jq -r '.[0].job_id')
          test -n "$id" && test "$id" != "null" || { echo "::error::job jobpilot-daily not found: deploy the bundle first"; exit 1; }
          echo "Running job $id" >> "$GITHUB_STEP_SUMMARY"
          # wait for the run so a failed pipeline also fails this workflow (visible in GitHub)
          if ! databricks jobs run-now "$id" --timeout 90m -o json > run.json 2> err.txt; then
            echo "::error title=Databricks job failed::$(tr '\n' ' ' < err.txt | cut -c1-900)"
            # surface each failed task's error in the GitHub UI
            rid=$(databricks jobs list-runs --job-id "$id" --limit 1 -o json | jq -r '.[0].run_id')
            databricks jobs get-run "$rid" -o json | jq -r '.tasks[] | select(.state.result_state=="FAILED") | "\(.run_id) \(.task_key)"' |
            while read trid tkey; do
              msg=$(databricks jobs get-run-output "$trid" -o json | jq -r '(.error // "") + " " + ((.error_trace // "") | .[-1500:])' | tr '\n' ' ')
              echo "::error title=Task $tkey failed::$msg"
            done
            exit 1
          fi
          jq -r '"Result: \(.state.result_state) · \(.run_page_url)"' run.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.tasks[] | "\(.task_key): \(.state.result_state)"' run.json | tee -a "$GITHUB_STEP_SUMMARY"
