# Workday and other-platform boards are configured by hand (see docs/CONNECTORS.md);
# Greenhouse and Lever boards are verified and written by tools/discover_boards.py.
boards:
- source: workday
  company: Accenture
  host: accenture.wd103.myworkdayjobs.com
  tenant: accenture
  site: AccentureCareers
  search_texts: [databricks]
  facets:
    locationCountry: [c4f78be1a8f14da0ab49ce1162348a5e]   # India
  max_pages: 15     # list pages (20 each); relevance-sorted, so the first pages matter most
  max_jobs: 150     # detail calls (one per job)
# ---- More Workday employers. No facet IDs needed: the connector finds each tenant's India filter
