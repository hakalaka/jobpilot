# Candidate career boards. The "discover-boards" GitHub Action probes each token on Greenhouse
# and Lever, keeps the ones that answer, and writes the verified list to config/sources.yaml.
# Add companies freely: a wrong token just gets reported as "not found".
# A token is the last part of the careers URL: job-boards.greenhouse.io/<token> or jobs.lever.co/<token>
